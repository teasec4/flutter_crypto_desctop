name: Tests

# Когда запускать workflow
on:
  push:
    branches: [main, develop]  # При push в main или develop
  pull_request:
    branches: [main, develop]  # При PR в main или develop

jobs:
  test:
    runs-on: ubuntu-latest  # Запускать на Ubuntu
    
    steps:
      # 1. Скачиваем код репозитория
      - uses: actions/checkout@v3
      
      # 2. Кэшируем pub зависимости
      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      # 3. Устанавливаем Flutter SDK (stable channel)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      # 4. Скачиваем зависимости проекта
      - name: Get dependencies
        run: flutter pub get
      
      # 5. Запускаем анализ кода (проверка ошибок)
      - name: Run analyzer
        run: flutter analyze
      
      # 6. Форматируем код (проверка что код форматирован правильно)
      - name: Check code format
        run: dart format --set-exit-if-changed .
      
      # 7. Запускаем тесты
      - name: Run tests
        run: flutter test
